<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff7a59">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="المصلي">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>المصلي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&family=Amiri:wght@400;700&family=Amiri+Quran&display=swap">
<style>
/* Layout: one-column phone app, cartoon sticker cards with hard ink shadows, sky scene hero that follows the time of day, bottom tab bar */
:root{
  --ink:#2b2350;          /* cartoon outline */
  --bg:#eef3ff;
  --bg2:#e3ebff;
  --card:#ffffff;
  --fg:#2b2350;
  --muted:#6f6894;
  --coral:#ff7a59;
  --gold:#ffc145;
  --sky:#4fb3ff;
  --plum:#7b5cd6;
  --peach:#ffd9c2;
  --aqua:#38c6d9;
  --soft:#f4f0ff;
  --line:#d9d2f3;
  --shadow:#2b2350;
  --f-display:"Baloo Bhaijaan 2","Tajawal","Segoe UI",Tahoma,sans-serif;
  --f-text:"Amiri","Traditional Arabic","Times New Roman",serif;
  --f-quran:"Amiri Quran","Amiri","Traditional Arabic",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17132e;--bg2:#1f1a3d;--card:#262049;--fg:#f3f0ff;--muted:#b3aad8;--soft:#2f2858;--line:#3d356b;--shadow:#0b0820;--peach:#4a3352;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17132e;--bg2:#1f1a3d;--card:#262049;--fg:#f3f0ff;--muted:#b3aad8;--soft:#2f2858;--line:#3d356b;--shadow:#0b0820;--peach:#4a3352;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-display);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(circle at 20% 0%,var(--bg2),transparent 55%);}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
.sticker{background:var(--card);border:2.5px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--shadow)}
:root[data-theme="dark"] .sticker{border-color:#0b0820}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sticker{border-color:#0b0820}}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:28px;font-weight:800;letter-spacing:0}
.brand small{display:block;color:var(--muted);font-size:13px;font-weight:500;margin-top:-4px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:4px 12px 4px 10px;font-weight:700;font-size:14px;box-shadow:0 3px 0 var(--shadow);min-width:0}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}

/* hero */
.hero{overflow:visible;position:relative;padding:0}
.scene{display:block;width:100%;height:auto;border-radius:21px 21px 0 0;border-bottom:2.5px solid var(--ink)}
.hero-body{padding:4px 18px 18px;display:grid;gap:4px;text-align:center}
.next-label{font-size:14px;color:var(--muted);font-weight:600}
.next-name{font-size:34px;font-weight:800;color:var(--coral);line-height:1.1}
.count{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:1.1;direction:ltr}
.next-at{font-size:15px;color:var(--muted)}
.dates{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{background:var(--soft);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.bar{height:12px;border:2px solid var(--ink);border-radius:999px;background:var(--soft);overflow:hidden;margin:8px 4px 0}
.bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--gold) 0 10px,#ffd36f 10px 20px);border-left:2px solid var(--ink);transition:width .6s}

/* prayer list */
.times{padding:8px;display:grid;gap:6px}
.trow{display:grid;grid-template-columns:44px 1fr auto 40px;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;border:2px solid transparent}
.trow .ic{width:44px;height:44px}
.trow .nm{font-weight:700;font-size:18px}
.trow .nm small{display:block;font-size:12px;color:var(--muted);font-weight:500;line-height:1.2}
.trow .tm{font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.trow.now{background:var(--peach);border-color:var(--ink)}
.trow.next{background:var(--soft)}
.trow.next .nm::after{content:"التالية";font-size:11px;background:var(--coral);color:#fff;border-radius:999px;padding:0 8px;margin-inline-start:8px;vertical-align:middle;font-weight:700}
.trow.now .nm::after{content:"الآن";font-size:11px;background:var(--plum);color:#fff;border-radius:999px;padding:0 8px;margin-inline-start:8px;vertical-align:middle;font-weight:700}
.bell{width:38px;height:38px;border-radius:12px;border:2px solid var(--ink);background:var(--card);display:grid;place-items:center;padding:0}
.bell svg{width:20px;height:20px}
.bell[aria-pressed="false"]{opacity:.45;background:transparent}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{padding:14px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;min-width:0}
.mini h3{font-size:15px;color:var(--muted);font-weight:600}
.mini b{font-size:20px}
.compass{width:96px;height:96px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2.5px solid var(--ink);border-radius:16px;padding:8px 16px;font-weight:800;background:var(--gold);color:#2b2350;box-shadow:0 4px 0 var(--shadow)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.btn.alt{background:var(--card);color:var(--fg)}
.btn.coral{background:var(--coral);color:#fff}
.btn.sm{padding:4px 12px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--shadow)}
.note{font-size:13px;color:var(--muted);text-align:center}

/* azkar */
.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px}
.section-title h2{font-size:24px;font-weight:800}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{position:relative;padding:14px 14px 12px;text-align:start;display:flex;flex-direction:column;gap:2px;min-height:118px;overflow:hidden;color:#2b2350}
.cat svg{width:46px;height:46px}
.cat b{font-size:18px;font-weight:800;line-height:1.3}
.cat small{font-size:12px;font-weight:600;opacity:.75}
.cat .prog{color:#2b2350;position:absolute;inset-inline-end:10px;top:10px;font-size:12px;font-weight:800;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 8px}
.zk-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:10px 12px;display:flex;align-items:center;gap:10px}
.zk-head h2{font-size:20px;flex:1;min-width:0}
.back{width:40px;height:40px;border-radius:12px;border:2px solid var(--ink);background:var(--soft);display:grid;place-items:center;padding:0;flex:none}
.back svg{width:20px;height:20px}
.zlist{display:grid;gap:14px}
.zk{padding:16px 16px 12px;display:grid;gap:10px;cursor:pointer;user-select:none;transition:opacity .3s,transform .1s}
.zk:active{transform:scale(.99)}
.zk p{margin:0;font-family:var(--f-text);font-size:21px;line-height:2;text-align:justify}
.zk p.q{font-family:var(--f-quran);font-size:22px;line-height:2.2}
.zk .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:2px dashed var(--line);padding-top:10px}
.zk .src{font-size:13px;color:var(--muted);font-weight:600;min-width:0}
.zk .cnt{min-width:64px;height:44px;border-radius:14px;border:2.5px solid var(--ink);background:var(--aqua);color:#2b2350;font-weight:800;font-size:20px;display:grid;place-items:center;padding:0 10px;font-variant-numeric:tabular-nums}
.zk.done{opacity:.55}
.zk.done .cnt{background:var(--gold)}
.zk .ttl{font-size:14px;font-weight:800;color:var(--plum)}
.ptrack{height:10px;border-radius:999px;background:var(--soft);overflow:hidden;border:2px solid var(--ink)}
.ptrack i{display:block;height:100%;background:var(--aqua);transition:width .3s}

/* tasbeeh */
.tsb{padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.tsb-btn{width:210px;height:210px;max-width:70vw;max-height:70vw;border-radius:50%;border:4px solid var(--ink);background:radial-gradient(circle at 35% 30%,#fff3c4,var(--gold) 60%,#f4a72c);box-shadow:0 8px 0 var(--shadow);display:grid;place-items:center;font-weight:800;font-size:64px;color:#2b2350;font-variant-numeric:tabular-nums}
.tsb-btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--shadow)}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.seg button{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:2px 14px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--plum);color:#fff}

/* quran */
.search{display:flex;align-items:center;gap:8px;padding:6px 12px}
.search input{border:0;background:transparent;flex:1;min-width:0;padding:6px 0;font-size:17px;outline:none}
.search svg{width:20px;height:20px;flex:none}
.surahs{display:grid;grid-template-columns:1fr;gap:10px}
.srow{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;padding:10px 14px;text-align:start;border-radius:18px;box-shadow:0 3px 0 var(--shadow)}
.star{width:46px;height:46px;position:relative;display:grid;place-items:center;font-weight:800;font-size:15px;color:#2b2350}
.star svg{position:absolute;inset:0;width:100%;height:100%}
.star span{position:relative}
.srow .sn{font-family:var(--f-quran);font-size:22px;line-height:1.5}
.srow .sm{font-size:12px;color:var(--muted);font-weight:600}
.badge{font-size:12px;font-weight:800;border-radius:999px;padding:1px 10px;border:2px solid var(--ink)}
.badge.m{background:var(--peach)}
.badge.d{background:#cfe9ff;color:#2b2350}
.cont{display:flex;align-items:center;gap:12px;padding:14px;background:var(--plum);color:#fff;text-align:start}
.cont b{font-size:18px}
.cont small{display:block;opacity:.85;font-size:13px}
.reader{padding:18px 16px 22px}
.sframe{position:relative;margin:2px 0 14px}
.sframe svg{width:100%;height:auto;display:block}
.sframe h2{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-quran);font-size:26px;font-weight:400;color:#2b2350}
.bsm{font-family:var(--f-quran);text-align:center;font-size:24px;margin:0 0 10px}
.qtext{font-family:var(--f-quran);font-size:var(--qsize,25px);line-height:2.25;text-align:justify;margin:0;word-spacing:2px}
.am{display:inline-grid;place-items:center;color:var(--plum);font-size:.85em;margin:0 2px;cursor:pointer;border-radius:8px}
.am.mark{background:var(--gold);color:#2b2350}
.rnav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.loading{display:grid;place-items:center;gap:10px;padding:30px;color:var(--muted);text-align:center}
.spin{width:42px;height:42px;border:5px solid var(--soft);border-top-color:var(--coral);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* settings */
.set{padding:16px;display:grid;gap:12px}
.set h3{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.field{display:grid;gap:4px}
.field label{font-size:14px;font-weight:700;color:var(--muted)}
select,.inp{width:100%;border:2px solid var(--ink);border-radius:14px;padding:8px 12px;background:var(--soft);min-width:0}
.voice{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:8px 10px;border:2px solid var(--line);border-radius:14px}
.voice.on{border-color:var(--ink);background:var(--peach)}
.voice input{width:20px;height:20px;accent-color:var(--coral)}
.voice b{font-size:16px;display:block;line-height:1.3}
.voice small{font-size:12px;color:var(--muted)}
.voices{display:grid;gap:8px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0}
.sw{width:52px;height:30px;border-radius:999px;border:2px solid var(--ink);background:var(--soft);position:relative;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:right .2s}
.sw[aria-checked="true"]{background:var(--aqua)}
.sw[aria-checked="true"]::after{right:25px;background:#fff;border:2px solid var(--ink);top:2px;width:22px;height:22px}

/* sheet & modal */
.scrim{position:fixed;inset:0;background:rgba(20,14,50,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:85%;overflow:auto;border-radius:26px 26px 0 0;border-bottom:0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.sheet h3{font-size:20px;font-weight:800}
.citylist{display:grid;gap:6px}
.city{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border:2px solid var(--line);border-radius:14px;background:var(--card);text-align:start;gap:8px}
.city small{color:var(--muted);font-size:12px}
.city.on{border-color:var(--ink);background:var(--peach)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,14,50,.6);display:grid;place-items:center;padding:20px}
.mbox{max-width:360px;width:100%;padding:22px;text-align:center;display:grid;gap:10px;justify-items:center}
.mbox svg{width:150px;height:auto}
.mbox h3{font-size:26px;font-weight:800;color:var(--coral)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;border-radius:999px;padding:6px 18px;font-weight:700;z-index:60;font-size:14px;max-width:90%}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.tabs nav{pointer-events:auto;max-width:500px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-radius:24px}
.tab{border:0;background:transparent;border-radius:18px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:0;font-weight:700;font-size:13px;color:var(--muted)}
.tab svg{width:26px;height:26px}
.tab[aria-selected="true"]{background:var(--coral);color:#fff}
.tab[aria-selected="true"] svg .fillme{fill:#fff}

/* day navigation */
.daynav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;padding:8px 8px 4px}
.daynav .nb{width:44px;height:44px;border-radius:14px;border:2.5px solid var(--ink);background:var(--gold);display:grid;place-items:center;padding:0;box-shadow:0 3px 0 var(--shadow);color:#2b2350}
.daynav .nb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.daynav .nb svg{width:22px;height:22px}
.daynav .dl{text-align:center;line-height:1.3;min-width:0}
.daynav .dl b{display:block;font-size:17px}
.daynav .dl small{color:var(--muted);font-size:13px;font-weight:600}
.dayfoot{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 8px 6px}
.linkbtn{border:0;background:transparent;color:var(--plum);font-weight:800;padding:2px 8px;text-decoration:underline;text-underline-offset:4px}
.mini.tap{cursor:pointer;border-width:2.5px}
.mini.tap:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shadow)}

/* month table */
.mhead{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;padding:10px}
.mhead .dl{text-align:center;line-height:1.3}
.mhead .dl b{display:block;font-size:19px}
.mhead .dl small{color:var(--muted);font-size:13px;font-weight:600}
.tblwrap{overflow-x:auto;padding:6px;border-radius:22px}
table.mt{width:100%;border-collapse:separate;border-spacing:0 4px;font-variant-numeric:tabular-nums;min-width:380px}
.mt th{font-size:12px;color:var(--muted);font-weight:800;padding:4px 2px;position:sticky;top:0;background:var(--card)}
.mt td{text-align:center;font-weight:700;font-size:14px;padding:7px 2px;background:var(--soft);white-space:nowrap}
.mt td:first-child{border-radius:0 12px 12px 0;text-align:start;padding-inline-start:8px;line-height:1.2}
.mt td:last-child{border-radius:12px 0 0 12px}
.mt td small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.mt tr{cursor:pointer}
.mt tr.fri td{background:var(--peach)}
.mt tr.today td{background:var(--gold);color:#2b2350}
.mt tr.today td small{color:#2b2350}
.mt tr.sel td{outline:2px solid var(--ink);outline-offset:-2px}

/* qibla sheet */
.qwrap{display:grid;justify-items:center;gap:10px}
.qdial{width:min(290px,78vw);height:auto;touch-action:none;cursor:grab;user-select:none}
.qdial:active{cursor:grabbing}
.qmsg{font-weight:800;font-size:18px;text-align:center;min-height:30px}
.qmsg.ok{color:var(--coral)}
.qtip{background:var(--soft);border-radius:16px;padding:10px 14px;font-size:15px;line-height:1.7;width:100%}
.qbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.qstats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* scene animation */
.cloud{animation:drift 40s linear infinite}
.cloud.c2{animation-duration:58s;animation-delay:-20s}
@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(440px)}}
.tw{animation:tw 3s ease-in-out infinite}
.tw:nth-child(2n){animation-delay:-1.2s}.tw:nth-child(3n){animation-delay:-2.1s}
@keyframes tw{50%{opacity:.25}}
.bob{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion: reduce){.cloud,.tw,.bob,.spin{animation:none}}
@media (min-width:480px){.surahs{grid-template-columns:1fr 1fr}.srow .sn{font-size:20px}}
</style>

<div class="app" id="app" dir="rtl" lang="ar">
  <header class="topbar">
    <div class="brand">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="#ffc145" stroke="#2b2350" stroke-width="2.5"/><path d="M27 10a12 12 0 1 0 6 21a10 10 0 1 1-6-21z" fill="#fff8e6" stroke="#2b2350" stroke-width="2.2" stroke-linejoin="round"/><path d="M30 15l1.2 2.6 2.8.3-2.1 1.9.6 2.8-2.5-1.4-2.5 1.4.6-2.8-2.1-1.9 2.8-.3z" fill="#ff7a59" stroke="#2b2350" stroke-width="1.2" stroke-linejoin="round"/></svg>
      <div><h1>المصلي</h1><small id="greet">رفيقك اليومي للصلاة والذكر</small></div>
    </div>
    <button class="chip" id="locChip" aria-label="تغيير الموقع"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-7.2 7-12.5A7 7 0 0 0 5 9.5C5 14.8 12 22 12 22z" fill="#ff7a59" stroke="#2b2350" stroke-width="2"/><circle cx="12" cy="9.5" r="2.6" fill="#fff" stroke="#2b2350" stroke-width="1.6"/></svg><span id="locName">الرياض</span></button>
  </header>

  <!-- PRAYER VIEW -->

function tzParts(date, tz){

  return {y:+p.year,m:+p.month,d:+p.day};
}

  catch(e){ return AR(date.toTimeString().slice(0,5)); }
}
function ymdAdd(p, n){ const d=new Date(Date.UTC(p.y,p.m-1,p.d+n,12)); return {y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate()}; }
function ymdNoon(p){ return new Date(Date.UTC(p.y,p.m-1,p.d,12)); }
function fmtYMD(p, opts){ try{ return new Intl.DateTimeFormat('ar-EG',Object.assign({timeZone:'UTC'},opts)).format(ymdNoon(p)); }catch(e){ return ''; } }
function hijriParts(p){ try{ const f=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{timeZone:'UTC',day:'numeric',month:'numeric',year:'numeric'}); const o=Object.fromEntries(f.formatToParts(ymdNoon(p)).map(x=>[x.type,x.value])); return {d:+o.day,m:+o.month,y:parseInt(o.year)}; }catch(e){ return null; } }

function computeYMD(p){

const FIVE=['fajr','dhuhr','asr','maghrib','isha'];
const NAME = Object.fromEntries(PR.map(p=>[p.k,p.n]));
const fired = new Set(store.get('fired',[]));
function tick(force){
  const now=new Date();
  const p=tzParts(now,S.loc.tz); const k=p.y+'-'+p.m+'-'+p.d;
  if(k!==dayKey || force){ refreshDays(); renderTimes(); }
  // next & current
  let next=null, cur=null, curT=null;
  for(const kk of FIVE){ if(today[kk]>now){ next={k:kk,t:today[kk]}; break; } }
  if(!next) next={k:'fajr',t:tomorrow.fajr};
  for(const kk of FIVE){ if(today[kk]<=now){ cur=kk; curT=today[kk]; } }
  if(!cur){ cur='isha'; curT=yesterday.isha; }
  const ms=next.t-now, s=Math.max(0,Math.floor(ms/1000));
  const hh=String(Math.floor(s/3600)).padStart(2,'0'), mm=String(Math.floor(s%3600/60)).padStart(2,'0'), ss=String(s%60).padStart(2,'0');
  $('#count').textContent=AR(`${hh}:${mm}:${ss}`);
  $('#nextName').textContent=NAME[next.k];
  $('#nextAt').textContent='يُرفع الأذان '+fmtTime(next.t);
  const span=next.t-curT; $('#progress').style.width=Math.min(100,Math.max(0,(1-ms/span)*100)).toFixed(1)+'%';
  const live = viewOffset===0;
  document.querySelectorAll('.trow').forEach(r=>{ r.classList.toggle('next',live && r.dataset.k===next.k && next.t<tomorrow.fajr); r.classList.toggle('now',live && r.dataset.k===cur && r.dataset.k!==next.k); });
  paintScene(phaseOf(now,today));
  // adhan trigger
  for(const kk of FIVE){
    const t=today[kk]; const id=k+':'+kk;
    if(now>=t && now-t<60000 && !fired.has(id)){
      fired.add(id); store.set('fired',[...fired].slice(-20));
      if(S.bells[kk]) adhanAlert(kk);
    }
  }
}

function bell(t, freq, dur, gain=0.25, type='sine'){
  const o=actx.createOscillator(), g=actx.createGain(), o2=actx.createOscillator(), g2=actx.createGain();
  o.type=type; o.frequency.value=freq; o2.type='sine'; o2.frequency.value=freq*2.76;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain,t+.01); g.gain.exponentialRampToValueAtTime(.0005,t+dur);
  g2.gain.setValueAtTime(0,t); g2.gain.linearRampToValueAtTime(gain*.25,t+.01); g2.gain.exponentialRampToValueAtTime(.0005,t+dur*.5);
  o.connect(g).connect(actx.destination); o2.connect(g2).connect(actx.destination);
  o.start(t); o2.start(t); o.stop(t+dur+.05); o2.stop(t+dur+.05); playing.push(o,o2);
}
function thump(t, f=110, gain=.6){
  const o=actx.createOscillator(), g=actx.createGain(); o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*.45,t+.18);
  g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(.001,t+.25); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+.3); playing.push(o);
}
async function playVoice(v, preview){
  unlockAudio(); stopAll();
  if(v.startsWith('u:') || v.startsWith('m:')){
    let src=null;
    const blob = await idb.get(v.startsWith('m:') ? v : v.slice(2));
    if(blob) src=URL.createObjectURL(blob);
    else if(v.startsWith('m:')) src=await hostedURL(v.slice(2));
    if(!src){ toast(v.startsWith('m:')?'أضف تسجيل '+voiceLabel(v)+' أولًا من الإعدادات':'لم يُعثر على الملف على هذا الجهاز'); if(!preview) playVoice('chime',false); return; }
    const a=new Audio(src); playing.push(a);
    try{ await a.play(); }catch(e){ toast('اضغط في أي مكان ثم جرّب مجددًا لتشغيل الصوت'); }
    if(preview) setTimeout(()=>{ if(playing.includes(a)) stopAll(); },12000);
    return;
  }
  if(!actx){ toast('اضغط في أي مكان لتفعيل الصوت'); return; }
  const t0=actx.currentTime+.05; const reps = preview?1:3;
  // Hijaz-flavoured scale on D: D Eb F# G A Bb C D
  const D=293.66, sc=[1,1.0595,1.2599,1.3348,1.4983,1.5874,1.7818,2];
  for(let r=0;r<reps;r++){
    const t=t0+r*(v==='drum'?5:4.6);
    if(v==='chime'){ [0,2,3,4,3,2,1,0].forEach((i,j)=>bell(t+j*.5,D*sc[i],2.4,.22)); }
    else if(v==='lantern'){ [7,4,5,4,2,4,7].forEach((i,j)=>bell(t+j*.42,D*2*sc[i]/2*1.5,1.6,.18,'triangle')); }
    else { [0,.5,.75,1.25,1.5,2,2.5,2.75,3.25].forEach((x,j)=>thump(t+x, j%3===2?160:105)); bell(t+3.8,D*2,1.8,.2); }
  }
}

/* ---------------- IndexedDB for uploaded muezzin voices ---------------- */
const idb = (()=>{
  let dbp=null;
  function open(){ if(dbp) return dbp; dbp=new Promise((res,rej)=>{ try{ const r=indexedDB.open('musalli',1); r.onupgradeneeded=()=>r.result.createObjectStore('voices'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); return dbp; }
  async function tx(mode, fn){ const db=await open(); return new Promise((res,rej)=>{ const t=db.transaction('voices',mode); const st=t.objectStore('voices'); const r=fn(st); t.oncomplete=()=>res(r&&r.result); t.onerror=()=>rej(t.error); }); }
  return { get:k=>tx('readonly',s=>s.get(k)).catch(()=>null), put:(k,v)=>tx('readwrite',s=>s.put(v,k)), del:k=>tx('readwrite',s=>s.delete(k)).catch(()=>{}) };
})();

function monthRange(anchor){
  if(mMode==='g'){ const start={y:anchor.y,m:anchor.m,d:1}; const days=new Date(Date.UTC(anchor.y,anchor.m,0)).getUTCDate(); return Array.from({length:days},(_,i)=>({y:anchor.y,m:anchor.m,d:i+1})); }
  const h=hijriParts(anchor); if(!h) return [];
  let s=anchor, guard=0; while(guard++<31){ const p=ymdAdd(s,-1); const hp=hijriParts(p); if(!hp||hp.m!==h.m) break; s=p; }
  const out=[]; let c=s; guard=0; while(guard++<31){ const hp=hijriParts(c); if(!hp||hp.m!==h.m) break; out.push(c); c=ymdAdd(c,1); }
  return out;
}

/* ---------------- Qibla compass ---------------- */
function sunPos(date, lat, lng){
  const r=Math.PI/180, n=date/864e5+2440587.5-2451545;
  const L=(280.460+0.9856474*n)%360, g=((357.528+0.9856003*n)%360)*r;
  const lam=(L+1.915*Math.sin(g)+0.020*Math.sin(2*g))*r, eps=(23.439-0.0000004*n)*r;
  const ra=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam)), dec=Math.asin(Math.sin(eps)*Math.sin(lam));
  const gmst=(280.46061837+360.98564736629*n)%360, H=((gmst+lng)*r)-ra, p=lat*r;
  const alt=Math.asin(Math.sin(p)*Math.sin(dec)+Math.cos(p)*Math.cos(dec)*Math.cos(H));
  const az=Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(p)-Math.tan(dec)*Math.cos(p))/r+180;
  return {alt:alt/r, az:((az%360)+360)%360};
}

const zdKey = ()=>{ const p=tzParts(new Date(),S.loc.tz); return 'z:'+p.y+'-'+p.m+'-'+p.d; };
let zprog = store.get(zdKey(), {});
function zsave(){ store.set(zdKey(), zprog); }
function zDone(cat){ const it=Z[cat].items; let n=0; it.forEach((x,i)=>{ if((zprog[cat+i]||0)>=x.c) n++; }); return n; }

function renderAzkarHome(){
  const v=$('#v-azkar'); v.innerHTML='';
  v.appendChild(el('div',{class:'section-title'},`<h2>الأذكار</h2><span class="pill">اضغط على الذكر لتعدّه</span>`));
  const grid=el('div',{class:'cats'});
  for(const k in Z){
    const c=Z[k]; const d=zDone(k);
    const b=el('button',{class:'sticker cat',style:`background:${c.c};${c.dark?'color:#fff':''}`},`${ZIC[c.ic]}<b>${c.t}</b><small>${c.s}</small><span class="prog">${AR(d)}/${AR(c.items.length)}</span>`);
    b.addEventListener('click',()=>renderAzkarList(k)); grid.appendChild(b);
  }
  const tb=el('button',{class:'sticker cat',style:'background:#ffc9b5'},`${ZIC.beads}<b>السبحة</b><small>عدّاد تسبيح حر</small>`);
  tb.addEventListener('click',renderTasbeeh); grid.appendChild(tb);
  v.appendChild(grid);
}
function renderAzkarList(cat){
  const c=Z[cat]; const v=$('#v-azkar'); v.innerHTML='';
  const head=el('div',{class:'sticker zk-head'});
  head.innerHTML=`<button class="back" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h2>${c.t}</h2><button class="btn sm alt" id="zreset">إعادة</button>`;
  v.appendChild(head);
  const track=el('div',{class:'ptrack'},'<i></i>'); head.after(track);
  const upd=()=>{ track.firstChild.style.width=(zDone(cat)/c.items.length*100)+'%'; };
  head.querySelector('.back').addEventListener('click',()=>{ renderAzkarHome(); window.scrollTo(0,0); });
  const list=el('div',{class:'zlist'});
  c.items.forEach((it,i)=>{
    const key=cat+i; const left=()=>Math.max(0,it.c-(zprog[key]||0));
    const card=el('div',{class:'sticker zk',role:'button',tabindex:'0','aria-label':'عدّ هذا الذكر'});
    card.innerHTML=`${it.ttl?`<div class="ttl">${esc(it.ttl)}</div>`:''}<p class="${it.q?'q':''}">${esc(AR(it.x))}</p><div class="foot"><span class="src">${!it.s?'':(it.s==='bm'?'متفق عليه':'رواه '+SRC[it.s])}${it.c>1?' · '+AR(it.c)+' مرات':''}</span><span class="cnt" aria-live="polite"></span></div>`;
    const cnt=card.querySelector('.cnt');
    const paint=()=>{ const l=left(); cnt.textContent = l? AR(l) : '✓'; card.classList.toggle('done',!l); };
    paint();
    const hit=()=>{ if(!left()) return; zprog[key]=(zprog[key]||0)+1; zsave(); paint(); upd(); try{navigator.vibrate&&navigator.vibrate(15);}catch(e){}
      if(!left()){ const nx=card.nextElementSibling; if(nx) setTimeout(()=>nx.scrollIntoView({behavior:'smooth',block:'center'}),250); if(zDone(cat)===c.items.length) toast('أتممت '+c.t+'، تقبّل الله منك'); } };
    card.addEventListener('click',hit); card.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); hit(); } });
    list.appendChild(card);
  });
  v.appendChild(list); upd();
  head.querySelector('#zreset').addEventListener('click',()=>{ c.items.forEach((x,i)=>delete zprog[cat+i]); zsave(); renderAzkarList(cat); });
  window.scrollTo(0,0);
}
function renderTasbeeh(){
  const v=$('#v-azkar'); v.innerHTML='';
  const st=store.get('tsb',{n:0,phrase:0,target:33});
  const PH=['سُبْحَانَ اللَّهِ','الْحَمْدُ لِلَّهِ','اللَّهُ أَكْبَرُ','لَا إِلَهَ إِلَّا اللَّهُ','أَسْتَغْفِرُ اللَّهَ','لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ'];
  const head=el('div',{class:'sticker zk-head'},`<button class="back" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h2>السبحة</h2><button class="btn sm alt" id="treset">تصفير</button>`);
  v.appendChild(head); head.querySelector('.back').addEventListener('click',renderAzkarHome);
  const box=el('div',{class:'sticker tsb'});
  box.innerHTML=`<div class="seg" id="tph"></div><p style="margin:0;font-family:var(--f-text);font-size:28px;font-weight:700" id="tphrase"></p><button class="tsb-btn" id="tbtn" aria-label="سبّح"></button><div class="note" id="tinfo"></div><div class="seg" id="ttar"></div>`;
  v.appendChild(box);
  const save=()=>store.set('tsb',st);
  const draw=()=>{
    box.querySelector('#tphrase').textContent=PH[st.phrase];
    box.querySelector('#tbtn').textContent=AR(st.n);
    box.querySelector('#tinfo').textContent= st.target? `الهدف ${AR(st.target)} · الدورات المكتملة ${AR(Math.floor(st.n/st.target))}` : 'عدّ مفتوح بلا هدف';
    const ph=box.querySelector('#tph'); ph.innerHTML=''; PH.forEach((p,i)=>{ const b=el('button',{'aria-pressed':String(i===st.phrase)},p.replace(/[ً-ْ]/g,'')); b.onclick=()=>{st.phrase=i;st.n=0;save();draw();}; ph.appendChild(b); });
    const tt=box.querySelector('#ttar'); tt.innerHTML=''; [33,100,0].forEach(t=>{ const b=el('button',{'aria-pressed':String(t===st.target)},t?AR(t):'∞'); b.onclick=()=>{st.target=t;save();draw();}; tt.appendChild(b); });
  };
  box.querySelector('#tbtn').addEventListener('click',()=>{ st.n++; save(); draw(); try{ navigator.vibrate&&navigator.vibrate(st.target&&st.n%st.target===0?[60,40,60]:12);}catch(e){} if(st.target&&st.n%st.target===0){ unlockAudio(); if(actx) bell(actx.currentTime+.02,587,1.2,.18); } });
  head.querySelector('#treset').addEventListener('click',()=>{ st.n=0; save(); draw(); });
  draw(); window.scrollTo(0,0);
}

  const last=store.get('last',null);
  if(last && Q[last.s-1]){
    const c=el('button',{class:'sticker cont'},`<svg width="46" height="46" viewBox="0 0 46 46"><path d="M23 10c-4-3-10-3-15-1v26c5-2 11-2 15 1c4-3 10-3 15-1V9c-5-2-11-2-15 1z" fill="#fff" stroke="#2b2350" stroke-width="2.5" stroke-linejoin="round"/><path d="M30 6v14l3-3 3 3V6" fill="#ff7a59" stroke="#2b2350" stroke-width="2"/></svg><div><b>تابع القراءة</b><small>سورة ${Q[last.s-1][0]} · الآية ${AR(last.a)}</small></div>`);
    c.addEventListener('click',()=>openSurah(last.s,last.a)); v.appendChild(c);
  }
  const sb=el('div',{class:'sticker search'},`<svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><input id="sq" placeholder="ابحث باسم السورة أو رقمها" aria-label="ابحث عن سورة">`);
  v.appendChild(sb);
  const seg=el('div',{class:'seg'}); [['all','كل السور'],['m','السور المكية'],['d','السور المدنية']].forEach(([k,t])=>{ const b=el('button',{'aria-pressed':String(qFilter===k)},t); b.onclick=()=>{qFilter=k;store.set('qf',k);seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));draw();}; seg.appendChild(b); });
  v.appendChild(seg);
  const grid=el('div',{class:'surahs'}); v.appendChild(grid);
  const norm=s=>s.replace(/[ً-ْٰ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه');
  const draw=()=>{
    const q=norm(sb.querySelector('input').value.trim()); grid.innerHTML='';
    Q.forEach((s,i)=>{
      if(qFilter!=='all' && s[1]!==qFilter) return;
      if(q && !norm(s[0]).includes(q) && String(i+1)!==q.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))) return;
      const b=el('button',{class:'sticker srow'},`<span class="star">${STAR}<span>${AR(i+1)}</span></span><span style="min-width:0"><span class="sn">سورة ${s[0]}</span><br><span class="sm">${AR(s[2].length)} آية</span></span><span class="badge ${s[1]}">${s[1]==='m'?'مكية':'مدنية'}</span>`);
      b.addEventListener('click',()=>openSurah(i+1)); grid.appendChild(b);
    });
    if(!grid.children.length) grid.appendChild(el('p',{class:'note'},'لا توجد سورة بهذا الاسم.'));
  };
  sb.querySelector('input').addEventListener('input',draw); draw();
}
let qsize=store.get('qsize',25);
function openSurah(n, ayah){
  const s=Q[n-1]; const v=$('#v-quran'); v.innerHTML='';
  const head=el('div',{class:'sticker zk-head'},`<button class="back" aria-label="فهرس السور"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h2>سورة ${s[0]}</h2><button class="btn sm alt" id="fm" aria-label="تصغير الخط">أ-</button><button class="btn sm alt" id="fp" aria-label="تكبير الخط">أ+</button>`);
  v.appendChild(head);
  head.querySelector('.back').addEventListener('click',()=>{ renderQuranHome(); window.scrollTo(0,0); });
  const rd=el('div',{class:'sticker reader'});
  rd.style.setProperty('--qsize',qsize+'px');
  rd.innerHTML=`<div class="sframe"><svg viewBox="0 0 340 64" aria-hidden="true"><path d="M30 6h280l24 26-24 26H30L6 32z" fill="${s[1]==='m'?'#ffd9c2':'#cfe9ff'}" stroke="#2b2350" stroke-width="2.6" stroke-linejoin="round"/><path d="M44 14h252l16 18-16 18H44L28 32z" fill="none" stroke="#2b2350" stroke-width="1.4" stroke-dasharray="4 4"/><circle cx="20" cy="32" r="5" fill="#ffc145" stroke="#2b2350" stroke-width="2"/><circle cx="320" cy="32" r="5" fill="#ffc145" stroke="#2b2350" stroke-width="2"/></svg><h2>سورة ${s[0]}</h2></div>
  <div class="dates" style="margin:-6px 0 12px"><span class="pill">${s[1]==='m'?'مكية':'مدنية'}</span><span class="pill">${AR(s[2].length)} آية</span><span class="pill">ترتيبها ${AR(n)}</span></div>
  ${n!==1&&n!==9?`<p class="bsm">${QV.BSM}</p>`:''}<p class="qtext"></p>`;
  const qt=rd.querySelector('.qtext'); const last=store.get('last',null);
  s[2].forEach((t,i)=>{ qt.appendChild(document.createTextNode(t+' ')); const m=el('span',{class:'am'+(last&&last.s===n&&last.a===i+1?' mark':''),'data-a':i+1,title:'حفظ موضع القراءة',role:'button',tabindex:'0'},'﴿'+AR(i+1)+'﴾'); qt.appendChild(m); qt.appendChild(document.createTextNode(' ')); });
  qt.addEventListener('click',e=>{ const m=e.target.closest('.am'); if(!m) return; qt.querySelectorAll('.am.mark').forEach(x=>x.classList.remove('mark')); m.classList.add('mark'); store.set('last',{s:n,a:+m.dataset.a}); toast('حُفظ موضع القراءة عند الآية '+AR(m.dataset.a)); });
  const nav=el('div',{class:'rnav'});
  if(n<114){ const b=el('button',{class:'btn'},'السورة التالية ←'); b.onclick=()=>openSurah(n+1); nav.appendChild(b); } else nav.appendChild(el('span'));
  if(n>1){ const b=el('button',{class:'btn alt'},'→ السورة السابقة'); b.onclick=()=>openSurah(n-1); nav.appendChild(b); }
  rd.appendChild(nav); v.appendChild(rd);
  rd.appendChild(el('p',{class:'note',style:'margin:12px 0 0'},'اضغط على رقم أي آية لحفظ موضع قراءتك.'));
  const setSize=d=>{ qsize=Math.min(40,Math.max(18,qsize+d)); store.set('qsize',qsize); rd.style.setProperty('--qsize',qsize+'px'); };
  head.querySelector('#fm').onclick=()=>setSize(-2); head.querySelector('#fp').onclick=()=>setSize(2);
  if(!last || last.s!==n) store.set('last',{s:n,a:ayah||1});
  if(ayah&&ayah>1){ const m=qt.querySelector(`.am[data-a="${ayah}"]`); if(m) setTimeout(()=>m.scrollIntoView({block:'center'}),50); } else window.scrollTo(0,0);
}

/* ---------------- Settings ---------------- */
function renderSettings(){
  const v=$('#v-settings'); v.innerHTML='';
  v.appendChild(el('div',{class:'section-title'},'<h2>الإعدادات</h2>'));
  const loc=el('div',{class:'sticker set'});
  loc.innerHTML=`<h3>الموقع وطريقة الحساب</h3>
   <div class="tog"><div><b>${esc(S.loc.name)}</b><div class="note" style="text-align:start">${AR(S.loc.lat.toFixed(2))}° ، ${AR(S.loc.lng.toFixed(2))}°</div></div><button class="btn sm" id="chLoc">تغيير الموقع</button></div>
   <div class="field"><label for="meth">طريقة حساب المواقيت</label><select id="meth">${Object.entries(METHODS).map(([k,t])=>`<option value="${k}"${k===S.method?' selected':''}>${t}</option>`).join('')}</select></div>
   <div class="field"><label for="madh">وقت العصر</label><select id="madh"><option value="Shafi"${S.madhab==='Shafi'?' selected':''}>الجمهور (الشافعي والمالكي والحنبلي)</option><option value="Hanafi"${S.madhab==='Hanafi'?' selected':''}>الحنفي</option></select></div>
   <div class="tog"><span>نظام ١٢ ساعة (ص / م)</span><button class="sw" role="switch" id="h12" aria-checked="${S.h12}" aria-label="نظام ١٢ ساعة"></button></div>`;
  v.appendChild(loc);
  loc.querySelector('#chLoc').onclick=openLocSheet;
  loc.querySelector('#meth').onchange=e=>{ S.method=e.target.value; store.set('method',S.method); tick(true); toast('تم تحديث المواقيت'); };
  loc.querySelector('#madh').onchange=e=>{ S.madhab=e.target.value; store.set('madhab',S.madhab); tick(true); };
  loc.querySelector('#h12').onclick=e=>{ S.h12=!S.h12; store.set('h12',S.h12); e.currentTarget.setAttribute('aria-checked',String(S.h12)); tick(true); };

  const ms=el('div',{class:'sticker set'});
  ms.innerHTML=`<h3>المؤذن</h3><p class="note" style="text-align:start;margin:0">اختر مؤذنك. أول مرة لكل مؤذن: اضغط «ابحث» لتنزيل تسجيل الأذان بصوته، ثم «أضف» لاختياره من ملفات جهازك، ويبقى محفوظًا في التطبيق.</p><div class="voices" id="mlist"></div>
   <div class="field"><label for="fajrSel">صوت أذان الفجر</label><select id="fajrSel"></select></div>`;
  v.appendChild(ms);
  const ml=ms.querySelector('#mlist');
  MUEZZINS.forEach(m=>{
    const id='m:'+m.id, ready=mReady.has(m.id)||hostedOK[m.id];
    const row=el('div',{class:'voice'+(S.voice===id?' on':'')});
    row.innerHTML=`<input type="radio" name="voice" id="v_m_${m.id}" ${S.voice===id?'checked':''} aria-label="${esc(m.n)}">
      <label for="v_m_${m.id}" style="display:flex;gap:10px;align-items:center;min-width:0"><svg width="36" height="36" viewBox="0 0 48 48" style="flex:none" aria-hidden="true"><rect x="2" y="2" width="44" height="44" rx="14" fill="${m.c}" stroke="#2b2350" stroke-width="2.5"/><rect x="19" y="18" width="10" height="24" fill="#fff" stroke="#2b2350" stroke-width="2.2"/><path d="M17 18l7-11 7 11z" fill="#ff7a59" stroke="#2b2350" stroke-width="2.2" stroke-linejoin="round"/><rect x="16" y="25" width="16" height="4" rx="2" fill="#7b5cd6" stroke="#2b2350" stroke-width="1.6"/></svg><span style="min-width:0"><b>${esc(m.n)}</b><small>${ready?'<span style="color:var(--coral);font-weight:800">جاهز ✓</span> · ':''}${esc(m.d)}</small></span></label>
      <span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${ready?'<button class="btn sm alt" data-a="play" aria-label="استماع">▶</button>':`<a class="btn sm alt" target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent('تحميل أذان '+m.n+' mp3')}">ابحث</a>`}<label class="btn sm" style="cursor:pointer">${ready?'تغيير':'أضف'}<input type="file" accept="audio/*" hidden></label>${mReady.has(m.id)?'<button class="btn sm alt" data-a="del" aria-label="حذف التسجيل">✕</button>':''}</span>`;
    row.querySelector('input[type=radio]').onchange=()=>{ if(!ready){ toast('أضف تسجيل '+m.n+' أولًا'); row.querySelector('input[type=radio]').checked=false; return; } S.voice=id; store.set('voice',id); renderSettings(); $('#voiceName').textContent=voiceLabel(id); };
    const pb=row.querySelector('[data-a=play]'); if(pb) pb.onclick=()=>{ unlockAudio(); setTimeout(()=>playVoice(id,true),60); };
    const db=row.querySelector('[data-a=del]'); if(db) db.onclick=async()=>{ stopAll(); await idb.del(id); mReady.delete(m.id); store.set('mready',[...mReady]); if(S.voice===id){S.voice='chime';store.set('voice','chime');} if(S.fajrVoice===id){S.fajrVoice='';store.set('fajrVoice','');} renderSettings(); $('#voiceName').textContent=voiceLabel(S.voice); };
    row.querySelector('input[type=file]').onchange=async e=>{
      const f=e.target.files[0]; if(!f) return;
      if(f.size>30*1024*1024){ toast('الملف أكبر من ٣٠ ميغابايت'); return; }
      try{ await idb.put(id,f); mReady.add(m.id); store.set('mready',[...mReady]); S.voice=id; store.set('voice',id); toast('تم حفظ أذان '+m.n+' واختياره'); renderSettings(); $('#voiceName').textContent=voiceLabel(id); }
      catch(err){ toast('تعذّر حفظ الملف على هذا الجهاز'); }
    };
    ml.appendChild(row);
  });
  // hosted copies (adhan-<id>.mp3 next to the app) light up without uploading
  Promise.all(MUEZZINS.filter(m=>!(m.id in hostedOK)).map(m=>hostedURL(m.id))).then(r=>{ if(r.some(Boolean) && S.tab==='settings') renderSettings(); });
  const fs=ms.querySelector('#fajrSel');
  const allV=[['','نفس صوت باقي الصلوات'],...MUEZZINS.filter(m=>mReady.has(m.id)||hostedOK[m.id]).map(m=>['m:'+m.id,m.n]),...Object.entries(SYNTH).map(([k,o])=>[k,o.n]),...uploads.map(u=>['u:'+u.id,u.name])];
  fs.innerHTML=allV.map(([k,t])=>`<option value="${esc(k)}"${k===S.fajrVoice?' selected':''}>${esc(t)}</option>`).join('');
  fs.onchange=e=>{ S.fajrVoice=e.target.value; store.set('fajrVoice',S.fajrVoice); toast('تم ضبط صوت أذان الفجر'); };

  const vs=el('div',{class:'sticker set'});
  vs.innerHTML=`<h3>نغمات وأصوات أخرى</h3><p class="note" style="text-align:start;margin:0">نغمات تنبيه جاهزة، أو أي تسجيل أذان آخر من جهازك.</p><div class="voices" id="vlist"></div>
   <label class="btn alt" style="cursor:pointer"><input type="file" id="vup" accept="audio/*" hidden>＋ إضافة صوت آخر من جهازي</label>`;
  v.appendChild(vs);
  const vl=vs.querySelector('#vlist');
  const opts=[...Object.entries(SYNTH).map(([k,o])=>({id:k,n:o.n,d:o.d})), ...uploads.map(u=>({id:'u:'+u.id,n:u.name,d:'تسجيل مضاف من جهازك',up:u.id}))];
  opts.forEach(o=>{
    const row=el('div',{class:'voice'+(S.voice===o.id?' on':'')});
    row.innerHTML=`<input type="radio" name="voice" id="v_${o.id.replace(':','_')}" ${S.voice===o.id?'checked':''} aria-label="${esc(o.n)}"><label for="v_${o.id.replace(':','_')}"><b>${esc(o.n)}</b><small>${o.d}</small></label><span style="display:flex;gap:6px"><button class="btn sm alt" aria-label="استماع">▶</button>${o.up?'<button class="btn sm alt" aria-label="حذف">✕</button>':''}</span>`;
    row.querySelector('input').onchange=()=>{ S.voice=o.id; store.set('voice',S.voice); renderSettings(); $('#voiceName').textContent=voiceLabel(S.voice); };
    const bs=row.querySelectorAll('button'); bs[0].onclick=()=>{ unlockAudio(); setTimeout(()=>playVoice(o.id,true),60); };
    if(o.up) bs[1].onclick=async()=>{ stopAll(); await idb.del(o.up); uploads=uploads.filter(u=>u.id!==o.up); store.set('uploads',uploads); if(S.voice===o.id){S.voice='chime';store.set('voice','chime');} renderSettings(); };
    vl.appendChild(row);
  });
  vs.appendChild(el('div',{class:'tog'},'<button class="btn sm coral" id="vstop" style="width:100%">إيقاف الصوت</button>'));
  vs.querySelector('#vstop').onclick=stopAll;
  vs.querySelector('#vup').onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    if(f.size>25*1024*1024){ toast('الملف أكبر من ٢٥ ميغابايت'); return; }
    const id=Date.now().toString(36);
    try{ await idb.put(id,f); uploads.push({id,name:f.name.replace(/\.[^.]+$/,'')}); store.set('uploads',uploads); S.voice='u:'+id; store.set('voice',S.voice); toast('أُضيف الصوت واختير للأذان'); renderSettings(); $('#voiceName').textContent=voiceLabel(S.voice); }
    catch(err){ toast('تعذّر حفظ الملف على هذا الجهاز'); }
  };

  const al=el('div',{class:'sticker set'});
  al.innerHTML='<h3>تنبيهات الأذان</h3>';
  FIVE.forEach(k=>{ const r=el('div',{class:'tog'},`<span>صلاة ${NAME[k]}</span><button class="sw" role="switch" aria-checked="${!!S.bells[k]}" aria-label="تنبيه صلاة ${NAME[k]}"></button>`);
    r.querySelector('button').onclick=e=>{ S.bells[k]=!S.bells[k]; store.set('bells',S.bells); e.currentTarget.setAttribute('aria-checked',String(S.bells[k])); renderTimes(); tick(); unlockAudio(); }; al.appendChild(r); });
  al.appendChild(el('p',{class:'note',style:'text-align:start;margin:0'},'يُرفع الأذان وتظهر رسالة التنبيه في وقت الصلاة ما دامت هذه الصفحة مفتوحة على جهازك.'));
  v.appendChild(al);
}

/* ---------------- Tabs ---------------- */
function go(tab){
  S.tab=tab; store.set('tab',tab); $('#v-month').hidden=true; $('#v-month').innerHTML=''; mSel=null; stopAll();
  ['prayer','azkar','quran','settings'].forEach(t=>{ $('#v-'+t).hidden = t!==tab; });
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
  if(tab==='azkar') renderAzkarHome();
  if(tab==='quran') renderQuranHome();
  if(tab==='settings') renderSettings();
  window.scrollTo(0,0);
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));
document.addEventListener('click',e=>{ const g=e.target.closest('[data-go]'); if(g) go(g.dataset.go); });

/* ---------------- Boot ---------------- */
function boot(){
  if(!window.adhan){ $('#nextName').textContent='تعذّر تحميل محرك المواقيت'; return; }
  refreshDays(); renderTimes(); tick(true);
  setInterval(()=>tick(false),1000);
  go(['prayer','azkar','quran','settings'].includes(S.tab)?S.tab:'prayer');
  loadQuran().catch(()=>{});
  // first launch: use the device location when the browser allows it (works when the app is hosted on its own site)
  if(!store.get('loc',null) && navigator.geolocation){
    try{ navigator.geolocation.getCurrentPosition(pos=>{
      const lat=+pos.coords.latitude.toFixed(4), lng=+pos.coords.longitude.toFixed(4);
      let best=null,bd=1e9; CITIES.forEach(c=>{ const d=(c[2]-lat)**2+(c[3]-lng)**2; if(d<bd){bd=d;best=c;} });
      setLoc({name: bd<0.15? best[0] : 'موقعي الحالي', country:'', lat, lng, tz: bd<4? best[4] : devTZ});
      toast('تم ضبط المواقيت على موقعك');
    },()=>{},{timeout:8000,maximumAge:3600000}); }catch(e){}
  }
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) tick(true); });
}
boot();
</script>
